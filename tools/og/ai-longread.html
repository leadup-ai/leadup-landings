<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG · ai-longread · LeadUp AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#141821;color:#F6F3EF;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;position:relative}
  .glow-or{position:absolute;left:-260px;top:-330px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,140,59,.30) 0%,rgba(255,140,59,.10) 42%,rgba(255,140,59,0) 70%)}
  .glow-cy{position:absolute;right:-300px;bottom:-420px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(127,208,238,.22) 0%,rgba(127,208,238,.07) 45%,rgba(127,208,238,0) 72%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%);mask-image:radial-gradient(ellipse at 30% 20%,#000 0%,rgba(0,0,0,.35) 60%,transparent 100%)}
  .frame{position:absolute;inset:0;border:1px solid rgba(255,255,255,.08)}
  .wrap{position:relative;height:100%;padding:52px 64px 48px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{height:52px;width:auto;display:block}
  .top .tag{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7FD0EE;border:1px solid rgba(127,208,238,.35);background:rgba(127,208,238,.08);padding:8px 16px;border-radius:999px;white-space:nowrap}
  .mid{max-width:1010px}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FF8C3B;border:1px solid rgba(255,140,59,.45);background:rgba(255,140,59,.14);padding:9px 18px;border-radius:999px;margin-bottom:26px}
  .kicker i{width:7px;height:7px;border-radius:50%;background:#FF8C3B;display:block}
  h1{font-size:62px;line-height:1.07;font-weight:800;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#FF8C3B}
  .sub{margin-top:22px;font-size:25px;line-height:1.35;font-weight:500;color:#A9B2BD;max-width:940px}
  .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
  .facts{display:flex;gap:12px;flex-wrap:wrap}
  .fact{font-size:19px;font-weight:700;color:#F6F3EF;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);padding:11px 20px;border-radius:999px;white-space:nowrap}
  .fact.free{color:#141821;background:#FF8C3B;border-color:#FF8C3B}
  .mentor{display:flex;align-items:center;gap:16px}
  .mentor img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:1px solid rgba(255,255,255,.18);background:#1B222C}
  .mentor .nm{font-size:21px;font-weight:800;line-height:1.2}
  .mentor .rl{font-size:16px;font-weight:500;color:#A9B2BD;margin-top:3px}
</style>
</head>
<body>
  <div class="glow-or"></div>
  <div class="glow-cy"></div>
  <div class="grid"></div>
  <div class="frame"></div>

  <div class="wrap">
    <div class="top">
      <img class="logo" src="https://raw.githubusercontent.com/leadup-ai/leadup-landings/main/assets/leadup-logo.svg" alt="LeadUp AI">
      <div class="tag">4 вечера · онлайн · 0 €</div>
    </div>

    <div class="mid">
      <div class="kicker"><i></i>Бесплатный ИИ-практикум</div>
      <h1>Чему можно научиться на ИИ <em>за четыре вечера</em></h1>
      <div class="sub">9 вопросов ментору: как проходят вечера, чему учишься и что делать после практикума.</div>
    </div>

    <div class="bot">
      <div class="facts">
        <div class="fact">Старт 27 октября</div>
        <div class="fact">19:00 по Мадриду</div>
        <div class="fact free">Бесплатно</div>
      </div>
      <div class="mentor">
        <img src="https://raw.githubusercontent.com/leadup-ai/leadup-landings/main/assets/mentor-nagin.svg" alt="Владимир Нагин">
        <div>
          <div class="nm">Владимир Нагин</div>
          <div class="rl">автор практикума и курсов LeadUp AI</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
