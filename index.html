<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LeadUp AI — лендинги</title>
<meta name="robots" content="noindex"/>
<style>
:root{--teal:#00E5C7;--bg:#0A0F0D;--fg:#EDEFEE;--fg3:rgba(237,239,238,.52);--b:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:56px 24px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:28px;letter-spacing:-0.02em;margin:0 0 8px}
p{color:var(--fg3);margin:0 0 28px}
code{font-family:ui-monospace,monospace;color:var(--teal)}
a.card{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border:1px solid var(--b);border-radius:14px;color:var(--fg);text-decoration:none;margin-bottom:12px}
a.card:hover{border-color:var(--teal)}
a.card .id{font-family:ui-monospace,monospace;font-size:12px;color:var(--teal)}
a.card .t{font-weight:600}
a.card .d{font-size:13px;color:var(--fg3)}
</style>
</head>
<body>
<div class="wrap">
<h1>LeadUp AI · лендинги</h1>
<p>Мультилендинги для A/B тестов Meta Ads. Схема: <code>landing_id/variant_id/</code>.</p>
<a class="card" href="ai-course/v1/">
  <span><span class="t">AI-Профессия — основной вариант</span><br><span class="d">8 недель практики, от 199 €</span></span>
  <span class="id">ai-course/v1</span>
</a>
</div>
</body>
</html>
