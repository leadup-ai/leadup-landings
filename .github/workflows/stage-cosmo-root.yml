name: stage-cosmo-root
on:
  push:
    paths:
      - '.github/workflows/stage-cosmo-root.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download staged catalog
        run: |
          set -euo pipefail
          curl -sSL --retry 5 --retry-all-errors --max-time 120 -o /tmp/stage.zip "https://backend.composio.dev/api/v3/sl/mLjWarY60N"
          mkdir -p /tmp/staged
          unzip -o -q /tmp/stage.zip -d /tmp/staged
          echo "25434fa40df7bfa23bd8732482dd2f10  /tmp/staged/root_new.html" | md5sum -c -
      - name: Install catalog
        run: |
          set -euo pipefail
          cp /tmp/staged/root_new.html index.html
          wc -c index.html
          grep -c 'lab/cosmo-ai/v2/' index.html
          grep -c 'lab/cosmo-ai/v1/' index.html
          grep -c 'ai-course/v1/' index.html
          grep -c 'ai-practicum/v1/' index.html
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "leadup-ai-bot"
          git config user.email "bot@leadup.guru"
          git add index.html
          git rm -q .github/workflows/stage-cosmo-root.yml
          git commit -m "catalog: add lab/cosmo-ai/v2 entry to landing index"
          git push origin HEAD:main
