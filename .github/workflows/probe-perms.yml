name: probe-perms
on:
  push:
    paths:
      - 'probe/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write and push a probe file
        run: |
          set -e
          mkdir -p probe
          echo "write-ok $(date -u +%Y-%m-%dT%H:%M:%SZ)" > probe/RESULT.txt
          git config user.name "leadup-bot"
          git config user.email "leadup-bot@users.noreply.github.com"
          git add -A
          git commit -m "probe: actions write permission"
          git push origin HEAD:main
