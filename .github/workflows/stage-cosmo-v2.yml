name: stage-cosmo-v2
on:
  push:
    paths:
      - '.github/workflows/stage-cosmo-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download staged build
        run: |
          set -euo pipefail
          curl -sSL --retry 5 --retry-all-errors --max-time 120 -o /tmp/stage.zip "https://backend.composio.dev/api/v3/sl/mLjWarY60N"
          ls -l /tmp/stage.zip
          mkdir -p /tmp/staged
          unzip -o -q /tmp/stage.zip -d /tmp/staged
          ls -l /tmp/staged
          echo "248c1065efa0ca29164cf88b45e247fc  /tmp/staged/out.html" | md5sum -c -
      - name: Install landing file
        run: |
          set -euo pipefail
          mkdir -p lab/cosmo-ai/v2
          cp /tmp/staged/out.html lab/cosmo-ai/v2/index.html
          wc -c lab/cosmo-ai/v2/index.html
          md5sum lab/cosmo-ai/v2/index.html
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "leadup-ai-bot"
          git config user.email "bot@leadup.guru"
          git add lab/cosmo-ai/v2/index.html
          git rm -q .github/workflows/stage-cosmo-v2.yml
          git commit -m "Add lab/cosmo-ai/v2 — faithful Cosmobooks replica re-skinned for LeadUp AI course"
          git push origin HEAD:main
