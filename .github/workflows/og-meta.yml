name: ai-longread OG image + meta tags

on:
  push:
    paths:
      - '.github/workflows/og-meta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render OG image (1200x630)
        run: |
          set -euo pipefail
          mkdir -p assets/og
          CHROME=""
          for c in google-chrome google-chrome-stable chromium chromium-browser chrome; do
            if command -v "$c" >/dev/null 2>&1; then CHROME="$(command -v "$c")"; break; fi
          done
          echo "chrome=$CHROME"
          if [ -z "$CHROME" ]; then echo "NO_CHROME_FOUND"; exit 1; fi
          "$CHROME" --version
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=20000 \
            --screenshot="$PWD/assets/og/ai-longread-1200x630.png" \
            "file://$PWD/tools/og/ai-longread.html"
          python3 -c "import struct;d=open('assets/og/ai-longread-1200x630.png','rb').read();print('png bytes',len(d),'dims',struct.unpack('>II',d[16:24]))"

      - name: Patch meta tags (description, canonical, OG, Twitter)
        run: python3 tools/og/patch_meta.py

      - name: Commit and clean up temp workflows
        run: |
          set -euo pipefail
          git config user.name "leadup-ai"
          git config user.email "nagin@leadupmarketers.com"
          git rm -f .github/workflows/og-meta.yml
          git rm -f .github/workflows/og-image.yml || true
          git add assets/og lab/ai-longread/v1/index.html lab/ai-longread/v2/index.html
          git commit -m "ai-longread v1/v2: OG image 1200x630 + meta description and OG/Twitter tags"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
