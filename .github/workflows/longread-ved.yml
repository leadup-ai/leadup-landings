name: longread-ved-to-uchastnik
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/longread-ved.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch longread v1/v2 and commit
        run: |
          set -e
          for v in v1 v2; do
            curl -fsSL -o /tmp/$v.html "https://raw.githubusercontent.com/leadup-ai/leadup-landings/main/lab/ai-longread/$v/index.html"
            sed -i -e 's/Ведущий/Участник/g' -e 's/ведущего/участника/g' -e 's|<span class="ava">В</span>|<span class="ava">У</span>|g' /tmp/$v.html
            cp /tmp/$v.html lab/ai-longread/$v/index.html
          done
          echo "v1 $(md5sum lab/ai-longread/v1/index.html)"
          echo "v2 $(md5sum lab/ai-longread/v2/index.html)"
          test "$(md5sum lab/ai-longread/v1/index.html | cut -d' ' -f1)" = "68a56355953135b78965134ab7d3fe09"
          test "$(md5sum lab/ai-longread/v2/index.html | cut -d' ' -f1)" = "1a93b618a834495287a5ff582c63f15c"
          git config user.name "leadup-ai"
          git config user.email "nagin@leadupmarketers.com"
          git add lab/ai-longread/v1/index.html lab/ai-longread/v2/index.html
          git commit -m "ai-longread v1/v2: «Ведущий» -> «Участник» (label + monogram)" || echo "no changes"
          git push
