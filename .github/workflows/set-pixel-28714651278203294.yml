name: "Set Meta Pixel 28714651278203294 (one-shot)"
on:
  push:
    branches:
      - "pixel/meta-pixel-581042486157971"
    paths:
      - "tools/pixel/set_pixel.py"
permissions:
  contents: write
jobs:
  set-pixel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pixel/meta-pixel-581042486157971
      - name: Apply pixel ID to landing pages
        run: python3 tools/pixel/set_pixel.py
      - name: Commit, remove this workflow, push
        run: |
          git config user.name "leadup-ai"
          git config user.email "nagin@leadupmarketers.com"
          git rm -q .github/workflows/set-pixel-28714651278203294.yml
          git add -A
          git commit -m "Meta Pixel: switch all 6 landing pages to 28714651278203294 (MBS Ads AI Agent)"
          git push
