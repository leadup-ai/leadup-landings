name: Build OG image (ai-longread)

on:
  push:
    paths:
      - '.github/workflows/og-image.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render OG card with headless Chrome
        run: |
          set -euo pipefail
          mkdir -p assets/og
          CHROME=""
          for c in google-chrome google-chrome-stable chromium chromium-browser chrome; do
            if command -v "$c" >/dev/null 2>&1; then CHROME="$(command -v "$c")"; break; fi
          done
          echo "chrome=$CHROME"
          if [ -z "$CHROME" ]; then echo "NO_CHROME_FOUND"; exit 1; fi
          "$CHROME" --version
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=15000 \
            --screenshot="$PWD/assets/og/ai-longread-1200x630.png" \
            "file://$PWD/tools/og/ai-longread.html"
          ls -l assets/og/
          python3 -c "import struct;d=open('assets/og/ai-longread-1200x630.png','rb').read();print('png bytes',len(d),'dims',struct.unpack('>II',d[16:24]))"
          if command -v convert >/dev/null 2>&1; then
            convert assets/og/ai-longread-1200x630.png -quality 90 -interlace Plane assets/og/ai-longread-1200x630.jpg || true
          fi
          ls -l assets/og/

      - name: Commit image and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "leadup-ai"
          git config user.email "nagin@leadupmarketers.com"
          git rm -f .github/workflows/og-image.yml
          git add assets/og
          git commit -m "Add OG image for ai-longread (1200x630) rendered from tools/og source"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
